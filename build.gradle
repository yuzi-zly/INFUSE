// build.gradle (Groovy DSL)

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.9' // (您使用的是 gradleup 的 shadow，保持不变)
    id 'application'
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

application {
    // shadow 插件会自动读取这个设置
    mainClass.set('com.CC.CLIParser') 
}

group 'org.INFUSE'
version '1.0.1[jdk17]'

boolean localLibs = project.hasProperty('localLibs')

repositories {
    if (localLibs) {
        // “离线模式”: 依赖将完全来自下面 dependencies 块中的 'fileTree'。
    } else {
        // “在线模式”: 使用 Maven Central 仓库
        mavenCentral()
    }
}

dependencies {
    if (localLibs) {
        // --- 离线模式 ---
        implementation fileTree('libs') { include '*.jar' }
        testImplementation fileTree('libs') { include '*.jar' }
        testRuntimeOnly fileTree('libs') { include '*.jar' }
    } else {
        // --- 在线模式---
        testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
        testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'

        implementation 'org.dom4j:dom4j:2.1.3'
        implementation 'commons-cli:commons-cli:1.5.0'
        implementation 'com.alibaba:fastjson:1.2.83' 
        implementation 'commons-io:commons-io:2.11.0'
        implementation 'org.apache.logging.log4j:log4j-api:2.19.0'
        implementation 'org.apache.logging.log4j:log4j-core:2.19.0'
    }
}

test {
    useJUnitPlatform()
    // 默认跳过测试，除非显式运行 gradle test
    onlyIf {
        project.hasProperty('runTests') || gradle.startParameter.taskNames.contains('test')
    }
    
    // 屏蔽 JUnit Platform 的日志信息
    systemProperty 'java.util.logging.config.file', "${project.projectDir}/src/test/resources/logging.properties"
    
    // 显示测试输出到控制台
    testLogging {
        // 显示被测程序的标准输出和错误输出
        showStandardStreams = true
        
        // 只显示关键事件
        events "passed", "failed", "skipped"
        
        // 失败时显示完整异常信息
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
}

// task vendorDependencies(type: Copy) {
//     // 1. 复制主代码的 *编译* 依赖 (e.g., compileOnly)
//     from configurations.compileClasspath

//     // 2. 复制主代码的 *运行* 依赖 (e.g., implementation, fastjson)
//     from configurations.runtimeClasspath

//     // 3. 复制测试代码的 *编译* 依赖 (e.g., testImplementation, junit-api, apiguardian)
//     from configurations.testCompileClasspath

//     // 4. 复制测试代码的 *运行* 依赖 (e.g., testRuntimeOnly, junit-engine)
//     from configurations.testRuntimeClasspath

//     // 目标目录
//     into 'libs'
    
//     // Copy 任务会自动处理重复的文件（即同一个 jar 包被包含多次）
//     // 所以这样是 100% 安全的
// }