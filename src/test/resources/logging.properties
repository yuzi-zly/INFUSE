# 屏蔽 JUnit Platform 的详细日志
org.junit.platform.level=WARNING
org.junit.platform.launcher.level=WARNING
org.junit.platform.launcher.core.level=WARNING

# 全局日志级别
.level=INFO

# 控制台处理器
handlers=java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
